<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scouting Amalgama Jotihunt app</title>

    <!-- PWA Instellingen en Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a252f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jotihunt">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Externe Leaflet CSS bibliotheek voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Koppeling naar het externe stijlenbestand -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= INLOGSCHERM ================= -->
    <div id="auth-overlay">
        <div id="auth-box">
            <h2>Inloggen</h2>
            <div id="auth-setup-hint" style="display:none; font-size:0.76rem; color:#f1c40f; font-weight:600; line-height:1.3;">
                Nog geen wachtwoord in Firebase gevonden. Het eerste wachtwoord dat je nu invoert wordt direct ingesteld als <b>Admin-wachtwoord</b>!
            </div>
            <input type="password" id="pin-input" placeholder="Wachtwoord / Pincode" maxlength="32" autofocus>
            <input type="text" id="username-input" placeholder="Naam" style="display:none;" maxlength="24">
            <button onclick="checkPin()">Inloggen</button>
            <div id="auth-error">Onjuist wachtwoord of naam ontbreekt</div>
        </div>
    </div>

    <!-- ================= HOOFDAPPLICATIE ================= -->
    <div id="app-container">
        <!-- Bovenste navigatie- en actiebalk -->
        <div id="header">
            <div id="header-title-box">
                <h1>Scouting Amalgama Jotihunt app</h1>
                <div id="user-badge">Niet ingelogd</div>
            </div>
            <div class="header-right">
                <button class="header-btn" id="btn-add-rd" onclick="if(window.addMarkerByRD) addMarkerByRD()" style="display:none;">+ RD</button>
                <button class="header-btn" id="clear-rd-btn" onclick="if(window.clearRdPoints) clearRdPoints()" style="display:none;">Wis</button>
                <button class="header-btn" id="btn-darkmode" onclick="toggleDarkMode()" title="Donkere kaartmodus aan/uit">🌙 Dark</button>
                <button class="header-btn" id="btn-logout" onclick="logout()" title="Uitloggen">Uitloggen</button>
            </div>
        </div>
        
        <!-- Kaartomgeving -->
        <div id="map-wrapper">
            <div id="map"></div>
        </div>
    </div>

    <!-- Service Worker Registratie voor offline functionaliteit -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(console.warn);
            });
        }
    </script>

    <!-- Externe Basis Bibliotheken (Alleen Leaflet & Firebase Compat v10) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>

    <!-- Modulaire App Scripts (Hunter + Basis) -->
    <script src="config.js"></script>
    <script src="map-viewer.js"></script>
    <script src="fox-alerts.js"></script>
    <script src="auth-gps.js"></script>
    <!-- Let op: admin-routing.js, admin-ui.js, admin-engine.js en proj4.js worden automatisch ingeladen zodra een Admin inlogt! -->
</body>
</html>
