<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scouting Amalgama Jotihunt app</title>

    <!-- PWA Instellingen en Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a252f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jotihunt">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Externe Leaflet CSS bibliotheken voor de kaart en tekenwerktuigen -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <!-- Proj4js bibliotheek voor conversie van Rijksdriehoekmeting (RD) coördinaten naar GPS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <!-- Koppeling naar het externe stijlenbestand -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= INLOGSCHERM ================= -->
    <div id="auth-overlay">
        <div id="auth-box">
            <h2>Inloggen</h2>
            <input type="password" id="pin-input" placeholder="Pincode" maxlength="4" autofocus>
            <input type="text" id="username-input" placeholder="Naam" style="display:none;" maxlength="24">
            <button onclick="checkPin()">Inloggen</button>
            <div id="auth-error">Onjuiste pincode of naam ontbreekt</div>
        </div>
    </div>

    <!-- ================= HOOFDAPPLICATIE ================= -->
    <div id="app-container">
        <!-- Bovenste navigatie- en actiebalk -->
        <div id="header">
            <div id="header-title-box">
                <h1>Scouting Amalgama Jotihunt app</h1>
                <div id="user-badge">Niet ingelogd</div>
            </div>
            <div class="header-right">
                <button class="header-btn" id="btn-fetch-latest" onclick="fetchLatestArticleManual()" style="display:none;" title="Laatste melding ophalen">🔔 Laatste</button>
                <button class="header-btn" id="btn-add-rd" onclick="addMarkerByRD()" style="display:none;">+ RD</button>
                <button class="header-btn" id="clear-rd-btn" onclick="clearRdPoints()" style="display:none;">Wis</button>
                <button class="header-btn" id="btn-darkmode" onclick="toggleDarkMode()" title="Donkere kaartmodus aan/uit">🌙 Dark</button>
                <button class="header-btn" id="btn-logout" onclick="logout()" title="Uitloggen">Uitloggen</button>
                <div><span id="api-status" style="color: #2ecc71;">●</span></div>
            </div>
        </div>

        <!-- Meldingenbanner voor vossenstatuswijzigingen of nieuwe artikelen -->
        <div id="notification-banner" onclick="openJotihuntSite()">
            <span id="notification-text">🔔 Nieuw bericht!</span>
            <button onclick="dismissNotification(event)" style="background: white; color: #e74c3c; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-weight: bold;">✕</button>
        </div>
        
        <!-- Kaartomgeving met vossenpaneel en Leaflet kaart -->
        <div id="map-wrapper">
            <div id="vossen-status-panel">
                <div id="vossen-status-header">
                    <span id="vossen-title">Vossen</span>
                    <button id="minimize-btn" onclick="toggleVossenPanel()" title="Minimaliseren">-</button>
                </div>
                <div id="vossen-list">
                    <div class="vogel-status-item">Laden...</div>
                </div>
            </div>

            <div id="map"></div>
        </div>
    </div>

    <!-- Service Worker Registratie voor offline functionaliteit -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(console.warn);
            });
        }
    </script>

    <!-- Externe JavaScript Bibliotheken (Leaflet & Firebase Compat v10) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Koppeling naar het externe logica-bestand -->
    <script src="app.js"></script>
</body>
</html>
